<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Victory | Escape Room</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="result-page">

        <section class="result-card victory-card">

            <div class="result-icon">
                ✓
            </div>

            <p class="game-label">
                CONGRATULATIONS
            </p>

            <h1>
                YOU ESCAPED!
            </h1>

            <p class="result-message">
                You solved all the puzzles and successfully escaped
                the room.
            </p>


            <div class="result-stats">

                <div class="result-stat">
                    <span>FINAL SCORE</span>
                    <strong>850</strong>
                </div>

                <div class="result-stat">
                    <span>TIME LEFT</span>
                    <strong>04:32</strong>
                </div>

            </div>


            <div class="result-actions">

                <a href="game.html" class="btn btn-primary">
                    Play Again
                </a>

                <a href="index.html" class="btn btn-secondary">
                    Main Menu
                </a>

            </div>

        </section>

    </main>

</body>

</html>
