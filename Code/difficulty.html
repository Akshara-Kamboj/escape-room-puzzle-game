<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Difficulty | Escape Room</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/themes.js"></script>
</head>

<body>

    <main class="home-page">

        <section class="difficulty-section" aria-labelledby="difficulty-heading">

            <div class="difficulty-section__header">

                <p class="game-label">
                    ESCAPE ROOM
                </p>

                <h1 id="difficulty-heading">
                    Choose Your Difficulty
                </h1>

                <p>
                    Pick a level, then press Start Game.
                    The timer starts only when the game begins.
                </p>

            </div>

            <!-- Level cards are built by js/difficulty.js from js/puzzles.js -->

            <div class="difficulty-grid" id="difficulty-grid" role="group" aria-labelledby="difficulty-heading">
                <noscript>Difficulty levels need JavaScript to be turned on.</noscript>
            </div>

            <div class="difficulty-actions">

                <a href="index.html" class="btn btn-secondary">
                    Back
                </a>

                <button type="button" class="btn btn-primary" id="start-btn" disabled>
                    Start Game
                </button>

            </div>

            <p class="theme-status" id="difficulty-status" role="status" aria-live="polite"></p>

        </section>

    </main>

    <script src="js/puzzles.js"></script>
    <script src="js/difficulty.js"></script>

</body>

</html>
