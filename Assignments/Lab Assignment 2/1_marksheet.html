<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>
    
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eaf4ff, #f7f9fc);
        color: #222;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
        text-align: center;
        color: #1f4e79;
        margin-bottom: 10px;
    }

    h2 {
        color: #2f6690;
        border-bottom: 2px solid #d9e8f5;
        padding-bottom: 7px;
        margin-top: 28px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th {
        background: #1f4e79;
        color: white;
    }

    th, td {
        padding: 14px;
        text-align: center;
        border: 1px solid #ddd;
    }

    tr:nth-child(even) {
        background: #f5f9fc;
    }

    .total {
        font-weight: bold;
        background: #dcecf8;
    }

    .card {
        background: #f7fbff;
        padding: 18px;
        border-left: 5px solid #2f6690;
        margin: 15px 0;
        border-radius: 8px;
    }

    ul, ol {
        line-height: 1.9;
    }

    .menu-item {
        display: flex;
        justify-content: space-between;
        background: #f7fbff;
        padding: 12px 18px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #e1edf6;
    }

    form {
        max-width: 650px;
        margin: auto;
    }

    label {
        display: inline-block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #bbb;
        border-radius: 7px;
        font-size: 15px;
    }

    .option-group {
        margin-bottom: 18px;
        padding: 15px;
        background: #f7fbff;
        border-radius: 8px;
    }

    .option-group label {
        margin-right: 18px;
        font-weight: normal;
    }

    input[type="submit"],
    input[type="reset"] {
        border: none;
        padding: 12px 25px;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
        margin-right: 10px;
        background: #1f4e79;
        color: white;
    }

    input[type="reset"] {
        background: #777;
    }

    .profile {
        text-align: center;
        padding-bottom: 20px;
        border-bottom: 1px solid #ddd;
    }

    .profile h1 {
        margin-bottom: 5px;
    }

    .contact {
        color: #666;
    }

    .footer {
        text-align: center;
        margin-top: 30px;
        color: #777;
        font-size: 14px;
    }
</style>

</head>
<body>
    <div class="container">
        <h1>Student Marksheet</h1>
        <p class="subtitle">Academic Performance Report</p>

        <table>
            <tr>
                <th>Subject</th>
                <th>Maximum Marks</th>
                <th>Obtained Marks</th>
            </tr>
            <tr><td>English</td><td>100</td><td>85</td></tr>
            <tr><td>Mathematics</td><td>100</td><td>92</td></tr>
            <tr><td>Science</td><td>100</td><td>88</td></tr>
            <tr><td>Computer</td><td>100</td><td>95</td></tr>
            <tr class="total"><td>Total</td><td>400</td><td>360</td></tr>
        </table>

        <div class="footer">Result: PASS | Percentage: 90%</div>
    </div>
</body>
</html>
