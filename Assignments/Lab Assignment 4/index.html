
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Shopping Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="#">ShopEase</a>
        <span class="text-white">Your Online Shopping Store</span>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Product Section -->
            <main class="col-lg-9 col-md-8">
                <h2 class="mb-4">Our Products</h2>
                <div class="row g-4" id="product-list">
                    <!-- Product cards are generated using JavaScript -->
                </div>
            </main>

            <!-- Shopping Cart -->
            <aside class="col-lg-3 col-md-4 mt-5 mt-md-0">
                <div class="cart-box">
                    <h3>Shopping Cart (<span id="cart-count">0</span>)</h3>
                    <hr>

                    <div id="cart-items">
                        <p class="text-muted">Your cart is empty.</p>
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between fw-bold">
                        <span>Grand Total:</span>
                        <span id="grand-total">₹0</span>
                    </div>
                </div>
            </aside>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
