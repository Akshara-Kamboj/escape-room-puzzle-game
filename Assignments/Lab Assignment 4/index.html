<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Shopping Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="#">ShopEase</a>
        <span class="text-white">Your Online Shopping Store</span>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <main class="col-lg-9 col-md-8">
                <h2 class="mb-4">Our Products</h2>
                <div class="row g-4" id="product-list"></div>
            </main>

            <aside class="col-lg-3 col-md-4 mt-5 mt-md-0">
                <div class="cart-box">
                    <h3>Shopping Cart (<span id="cart-count">0</span>)</h3>
                    <hr>
                    <div id="cart-items">Your cart is empty.</div>
                    <hr>
                    <p class="mb-2">Items: <span id="item-count">0</span></p>
                    <div class="d-flex justify-content-between fw-bold">
                        <span>Grand Total:</span>
                        <span id="grand-total">₹0</span>
                    </div>
                    <button class="btn btn-success w-100 mt-3" onclick="checkout()">
                        Proceed to Checkout
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
