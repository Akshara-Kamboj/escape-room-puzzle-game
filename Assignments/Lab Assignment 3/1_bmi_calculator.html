<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:min(420px,90%);background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{text-align:center;color:#1f4e79;margin-top:0}.subtitle{text-align:center;color:#666}
label{display:block;font-weight:bold;margin-top:18px;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{width:100%;margin-top:22px;padding:13px;background:#1f4e79;color:#fff;border:0;border-radius:8px;font-size:16px;cursor:pointer}
#result{margin-top:22px;padding:15px;text-align:center;background:#f1f7fc;border-radius:8px;font-weight:bold;display:none}
</style>
</head>
<body>
<div class="card">
<h1>BMI Calculator</h1>
<p class="subtitle">Enter your height and weight</p>
<label for="height">Height (in cm)</label>
<input type="number" id="height" placeholder="Enter height">
<label for="weight">Weight (in kg)</label>
<input type="number" id="weight" placeholder="Enter weight">
<button onclick="calculateBMI()">Calculate BMI</button>
<div id="result"></div>
</div>
<script>
function calculateBMI(){
 const height=document.getElementById("height").value;
 const weight=document.getElementById("weight").value;
 const result=document.getElementById("result");
 if(!height || !weight || height<=0 || weight<=0){
   result.style.display="block";
   result.innerHTML="Please enter valid height and weight.";
   return;
 }
 const bmi=weight/((height/100)*(height/100));
 let category="";
 if(bmi<18.5) category="Underweight";
 else if(bmi<25) category="Normal";
 else category="Overweight";
 result.style.display="block";
 result.innerHTML=`Your BMI is <b>${bmi.toFixed(2)}</b><br>Category: <b>${category}</b>`;
}
</script>
</body>
</html>
